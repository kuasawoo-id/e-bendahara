<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>E-Bendahara</title>
  <meta name="description" content="Pencatatan keuangan internal KUA">
  <meta name="theme-color" content="#0F6B4F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="E-Bendahara">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230F6B4F'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%23F4D27C' stroke-width='4'/%3E%3Ctext x='32' y='38.5' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='700' font-size='17' fill='%23F4D27C'%3ERp%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Pasang tema sebelum halaman tergambar agar tidak berkedip.
    (function () {
      try {
        var t = localStorage.getItem('eb_tema');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <!-- Layar pemuatan -->
  <div id="splash" class="layar layar-tengah">
    <div class="logo-besar" aria-hidden="true"></div>
    <div class="splash-nama">E-Bendahara</div>
    <div class="pemutar" role="status" aria-label="Memuat"></div>
    <p id="splash-pesan" class="muted">Menyiapkan aplikasi…</p>
  </div>

  <!-- Layar belum dikonfigurasi -->
  <div id="layar-config" class="layar layar-tengah" hidden>
    <div class="logo-besar" aria-hidden="true"></div>
    <h1>Alamat server belum diisi</h1>
    <p class="muted">Buka berkas <b>js/config.js</b>, isi <b>GAS_URL</b> dengan URL <code>/exec</code> dari Apps Script, lalu unggah ulang.</p>
  </div>

  <!-- Login -->
  <div id="layar-login" class="layar" hidden>
    <div class="login-kepala">
      <div class="logo-besar" aria-hidden="true"></div>
      <h1>E-Bendahara</h1>
      <p>Catatan keuangan kantor</p>
    </div>
    <div id="login-isi" class="login-isi"></div>
    <p class="merek">Ahzani Labs</p>
  </div>

  <!-- Aplikasi -->
  <div id="app" hidden>
    <header class="topbar">
      <button class="ikon-tombol" id="tombol-kembali" hidden aria-label="Kembali"></button>
      <div class="topbar-judul">
        <div id="judul-hal">Beranda</div>
        <div id="sub-hal" class="topbar-sub"></div>
      </div>
      <button class="ikon-tombol" id="tombol-segarkan" aria-label="Perbarui data"></button>
    </header>
    <div id="indikator-tarik" class="indikator-tarik" aria-hidden="true"></div>
    <main id="konten">
      <section class="hal" id="hal-beranda"></section>
      <section class="hal" id="hal-transaksi"></section>
      <section class="hal" id="hal-iuran"></section>
      <section class="hal" id="hal-lainnya"></section>
      <section class="hal" id="hal-laporan"></section>
      <section class="hal" id="hal-riwayat"></section>
      <section class="hal" id="hal-pengguna"></section>
      <section class="hal" id="hal-kelola-iuran"></section>
      <section class="hal" id="hal-kategori"></section>
      <section class="hal" id="hal-saldo-awal"></section>
      <section class="hal" id="hal-visibilitas"></section>
      <section class="hal" id="hal-ganti-pin"></section>
    </main>
    <nav class="nav-bawah" id="nav-bawah" aria-label="Menu utama"></nav>
  </div>

  <!-- Lembar bawah (form, detail) -->
  <div id="sheet-latar" class="sheet-latar" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-judul">
      <div class="sheet-pegangan" aria-hidden="true"></div>
      <div class="sheet-kepala">
        <button class="ikon-tombol" id="sheet-kembali" hidden aria-label="Langkah sebelumnya"></button>
        <h2 id="sheet-judul"></h2>
        <button class="ikon-tombol" id="sheet-tutup" aria-label="Tutup"></button>
      </div>
      <div class="sheet-isi" id="sheet-isi"></div>
    </div>
  </div>

  <!-- Dialog konfirmasi -->
  <div id="dialog-latar" class="dialog-latar" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dialog-judul">
      <h2 id="dialog-judul"></h2>
      <div id="dialog-isi" class="dialog-isi"></div>
      <div class="dialog-aksi">
        <button class="tombol tombol-garis" id="dialog-tidak">Batal</button>
        <button class="tombol tombol-utama" id="dialog-ya">Ya</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/forms.js"></script>
  <script src="js/kelola.js"></script>
</body>
</html>
